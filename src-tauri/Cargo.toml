[package]
name = "rhystic-tracker"
default-run = "rhystic-tracker"
version = "2.0.0"
description = "Rhystic Tracker Tauri Desktop Application"
authors = ["Dave Pople"]
edition = "2021"
# Also drives the in-app update checker (see `resolve_update_repo_slug` in
# src/commands/system.rs). Override at build time with RHYSTIC_UPDATE_REPO=owner/repo.
repository = "https://github.com/Matt4C6F656872/Rhystic-Tracker-Web"

[features]
production-env = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.0", features = ["full"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
dirs = "5.0"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
